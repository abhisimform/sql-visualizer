<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL Execution Visualizer</title>
  <script>
    const savedTheme = localStorage.getItem("sql-visualizer-theme");
    if (savedTheme === "light" || savedTheme === "dark") {
      document.documentElement.dataset.theme = savedTheme;
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page-shell">
    <section class="hero-card">
      <div class="hero-topbar">
        <div>
          <p class="eyebrow">Interactive playground</p>
          <h1>SQL Execution Visualizer</h1>
          <p class="hero-copy">Step through how a simple SQL query transforms your dataset in memory.</p>
        </div>

        <button id="themeToggle" class="theme-toggle" type="button">
          <span class="theme-toggle-mark" aria-hidden="true"></span>
          <span id="themeLabel">Dark mode</span>
        </button>
      </div>
    </section>

    <section class="workspace-grid">
      <section class="panel panel-editor">
        <div class="panel-heading">
          <h2>Query</h2>
          <span class="panel-badge">Saved locally</span>
        </div>

        <textarea id="queryInput" rows="5">SELECT * FROM employees</textarea>

        <div class="action-row">
          <button id="runButton" class="button button-primary" type="button">Run Query</button>
          <p id="stepLabel" class="step-label">Ready to execute.</p>
        </div>

        <div class="query-card">
          <div class="panel-heading compact">
            <h3>Execution order</h3>
          </div>
          <div class="query" id="queryDisplay"></div>
        </div>

        <div class="nav-row">
          <button id="prevButton" class="button button-secondary" type="button">Previous Step</button>
          <button id="nextButton" class="button button-secondary" type="button">Next Step</button>
        </div>
      </section>

      <section class="panel panel-results">
        <div class="panel-heading">
          <h2>Current Dataset</h2>
          <div class="results-tools">
            <span id="rowCount" class="panel-badge">Rows: 0</span>
            <button id="copyDataButton" class="button button-secondary button-copy" type="button" aria-label="Copy current table data" title="Copy current table data">
              <span class="button-copy-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <path d="M9 9a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-7a2 2 0 0 1-2-2V9Zm-4 6V6a2 2 0 0 1 2-2h7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </button>
          </div>
        </div>

        <div class="table-shell">
          <div id="table" class="table-host"></div>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>

</html>
