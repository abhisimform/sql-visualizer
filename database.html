<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database Browser - SQL Visualizer</title>
  <script>
    const savedTheme = localStorage.getItem("sql-visualizer-theme");
    if (savedTheme === "light" || savedTheme === "dark") {
      document.documentElement.dataset.theme = savedTheme;
    }
  </script>
  
  <!-- Premium Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- Mesh Grid overlay -->
  <div class="mesh-overlay" aria-hidden="true"></div>

  <!-- Main Navigation Bar -->
  <header class="navbar">
    <div class="nav-logo">
      <div class="logo-dot"></div>
      <span class="logo-title">SQL Visualizer</span>
    </div>
    
    <nav class="nav-links">
      <a href="index.html" class="nav-item">Playground</a>
      <a href="database.html" class="nav-item active">Browse Database</a>
    </nav>
    
    <div class="nav-actions">
      <button id="themeToggle" class="theme-btn" type="button" aria-label="Toggle light/dark mode">
        <span class="theme-btn-dot"></span>
        <span id="themeLabel">Dark mode</span>
      </button>
    </div>
  </header>

  <!-- Database Browser Workspace -->
  <main class="database-browser-layout">
    <!-- Left Sidebar: Tables list -->
    <aside class="browser-sidebar">
      <div class="sidebar-title">
        <span class="sidebar-indicator">🗂️</span>
        <h3>Database Tables</h3>
      </div>
      <div id="tableSelectorList" class="browser-table-list"></div>
    </aside>

    <!-- Right Column: Schema & Data Preview -->
    <section class="browser-main-area">
      <!-- Schema Attributes Card -->
      <div class="card schema-details-card">
        <div class="card-title-row">
          <div class="card-status-info">
            <span class="schema-tag-dot"></span>
            <h3 id="currentTableName">Select a table</h3>
          </div>
          <span id="rowCountBadge" class="results-badge">Rows: 0</span>
        </div>

        <div class="schema-columns-preview">
          <h4>Columns Attributes</h4>
          <div id="columnAttributesList" class="attributes-grid"></div>
        </div>
      </div>

      <!-- Data Preview Card -->
      <div class="card preview-data-card">
        <div class="card-title-row">
          <h3>Table Data Preview</h3>
        </div>

        <div class="results-table-outer">
          <div id="previewTableContainer" class="table-render-host"></div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="js/ui/database-browser.js"></script>
</body>

</html>
